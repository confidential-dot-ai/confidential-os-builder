[Build]
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute
# The tools tree gets the pinned apt sources from the same sandbox tree as
# the image: it inherits nothing from [Distribution], so the tree must be
# handed to it explicitly (#96). Paths in conf.d files resolve relative to
# the config directory (mkosi/base), not this file's directory.
ToolsTreeSandboxTrees=mkosi.sandbox
