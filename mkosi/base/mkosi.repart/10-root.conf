[Partition]
Type=root
CopyFiles=/
### The kernel boots from the UKI on the ESP and is never read from the root.
### Keeping it out of the root partition is what lets `confos build` seal the
### root hash into the kernel's IPE policy after the root is built: the hash
### must not depend on the kernel that pins it. The path carries the version
### from kernel/version; src/kernel/ipe.rs fails the build if they drift.
ExcludeFiles=/usr/lib/modules/6.16.12/vmlinuz
Verity=data
VerityMatchKey=root
### read-only for dm-verity
ReadOnly=yes
Minimize=best
Format=erofs
SectorSize=4096
SizeMinBytes=1G
### 16G ceiling for the c8s profile (rke2 + airgap bundles + NVIDIA
### userspace/firmware ≈ 5-6G of content). Minimize=best shrinks every
### image to its content, so this only raises the failure ceiling.
SizeMaxBytes=16G
