preserve_sources_list: true
# Networking belongs to systemd-networkd: the baked 80-dhcp.network manages
# every non-dummy link already. cloud-init's renderer would only duplicate
# that into /etc/netplan — read-only under the default immutable root — and
# reintroduce the dummy0 wait-online stall (see mkosi.conf's cmdline note).
network: {config: disabled}
# No runtime-created default user: useradd writes /etc/passwd, which is
# read-only under the default immutable root. Bake accounts at build time,
# or build with the mutable profile. User-data that declares `users:` still
# replaces this list, so mutable-posture images keep working as before.
users: []
