preserve_sources_list: true
# Under the default immutable root cloud-init may only write state
# directories (/var, /home, /root, /run); /etc is read-only. Everything
# below turns off a module that would otherwise write /etc on every boot.
# Bake the equivalent at build time (hostname, users, network are all baked
# already), or build with --profile mutable if user-data must mutate /etc —
# user-data keys still override these defaults there.
network: {config: disabled}   # networkd's baked 80-dhcp.network manages links; see mkosi.conf
preserve_hostname: true       # /etc/hostname is baked
manage_etc_hosts: false
users: []                     # no runtime-created default user; useradd needs /etc/passwd
