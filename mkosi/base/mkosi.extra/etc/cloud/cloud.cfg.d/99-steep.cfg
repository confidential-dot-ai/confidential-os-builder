preserve_sources_list: true
# The root is immutable: cloud-init may only write state directories
# (/var, /home, /root, /run); /etc is read-only. Each knob below turns off a
# module that would otherwise write /etc on every boot, and each is a
# deliberate loss of a runtime feature in favour of the baked equivalent:
#   network — no datasource network-config is applied, not even from an
#             attached cidata disk; networkd's baked 80-dhcp.network manages
#             every link (see the numdummies note in mkosi.conf).
#   hostname — every guest carries the baked /etc/hostname; datasource
#              local-hostname is ignored.
#   users — no runtime-created account (useradd needs /etc/passwd); bake
#           accounts with --extra.
# User-data can still set these keys, but the writes they imply fail.
network: {config: disabled}
preserve_hostname: true
manage_etc_hosts: false
users: []
