preserve_sources_list: true
# Cloud-init may write only to declared runtime state. The base exposes /var,
# /home, /root, /tmp, and /run; undeclared paths under /etc remain read-only.
# These settings disable features that would otherwise update /etc and replace
# them with measured build-time configuration:
#   network — ignore datasource network-config; the baked 80-dhcp.network
#             manages every link (see the numdummies note in mkosi.conf).
#   hostname — ignore datasource local-hostname; /etc/hostname is baked.
#   users — do not create a default account; bake accounts with --extra
#           because useradd needs the read-only /etc/passwd.
# User-data can override these settings, but resulting writes to undeclared
# /etc paths fail.
network: {config: disabled}
preserve_hostname: true
manage_etc_hosts: false
users: []
# Only the baked seed (/var/lib/cloud/seed/nocloud, measured) feeds
# NoCloud. fs_label: null turns off its search for an attached disk labelled
# cidata — otherwise the host could hand any image unmeasured user-data at
# boot. ds-identify still hardcodes that label, so such a disk can wake
# cloud-init up, but the datasource then finds nothing and no user-data is
# applied. Runtime-supplied user-data returns once the initrd can measure
# it. datasource_list is left at the
# default on purpose: an explicit one-entry list makes ds-identify run
# cloud-init on every image, seed or not.
datasource:
  NoCloud:
    fs_label: null
