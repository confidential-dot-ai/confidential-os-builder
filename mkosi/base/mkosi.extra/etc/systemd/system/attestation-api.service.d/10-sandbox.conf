# Sandbox shared by every profile that ships attestation-api (attest,
# attest-gpu); inert in images without the unit. Device grants stay in the
# per-profile unit files — they differ (GPU nodes).
#
# --- vsock fence -------------------------------------------------------------
# attestation-api is the ONLY unit in the image allowed AF_VSOCK: on TDX the
# quote is fetched from the host QGS over vsock (CID 2, port 4050); on SNP the
# family goes unused. Every other unit carries a RestrictAddressFamilies= line
# WITHOUT AF_VSOCK, so attestation is the sole consumer of the host<->guest
# channel. UNIX for local plumbing (NVML <-> persistenced), INET/INET6 for the
# HTTP endpoint + NRAS egress, NETLINK for trivial ifquery paths libc may take.
[Service]
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_VSOCK
NoNewPrivileges=yes
ProtectHome=yes
PrivateTmp=yes
LockPersonality=yes
RestrictRealtime=yes
