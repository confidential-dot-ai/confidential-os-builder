# Opt-in operator-managed CPU container environment. Compose with ssh and
# kernel/general-purpose.config; general-purpose-gpu adds NVIDIA-specific userspace.
[Content]
CleanPackageMetadata=no
Packages=
    build-essential
    ca-certificates
    containerd
    docker.io
    git
    jq
    nftables
    procps
    python3-pip
    python3-venv
    runc
    systemd-timesyncd
# The attest endpoint's verifiers compare an SNP report's REPORT_DATA to the
# bytes the guest asked for; none replays the kernel's measurement-register
# commitment yet. mkosi appends this to the base command line, so it is part
# of the measured UKI. See docs/VERIFYING.md#sev-snp-measurement-registers.
KernelCommandLine=snp_measurement_registers=off
