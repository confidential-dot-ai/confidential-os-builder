# Dev profile only: forward the journal to the serial console so a guest's
# service output (not just kernel printk and systemd's boot status) reaches
# the host-side serial log. TTYPath pins ttyS0 because the dev cmdline ends
# with console=hvc0, which owns /dev/console when a hypervisor provides it.
[Journal]
ForwardToConsole=yes
TTYPath=/dev/ttyS0
MaxLevelConsole=info
