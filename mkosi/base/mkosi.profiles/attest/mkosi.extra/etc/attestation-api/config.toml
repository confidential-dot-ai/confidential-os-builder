# Baked by `confos build --profile attest`. This measured configuration is
# read-only at runtime; change it at build time.
#
# Only tables every pinned attestation-api accepts: newer releases reject
# unknown fields, and dropped the [certs] table for their collateral layer.

[server]
bind = "0.0.0.0:8400"

[server.tls]
enabled = false

[auth]
api_keys = []

[token]
enabled = false

[attestation]
enabled = true
# `snp` for AMD SEV-SNP guests, `tdx` for Intel TDX guests. The binary
# probes /dev/sev-guest and /dev/tdx_guest at runtime and only reports
# the platforms whose device is actually present, so listing both here
# is safe on either host. `tdx_quote_method = "auto"` (default) tries
# vsock (QGS) first and falls back to ConfigFS TSM.
platforms = ["snp", "tdx"]
