# Replace the base's measured NoCloud seed with the Google Compute Engine datasource.
# The SSH key comes from cloud metadata and is NOT launch-measured: the cloud
# control plane decides who can log in. Use the opkeydata disk path (TDX
# RTMR[3] binding) where that matters.
# GCE passes keys as "user:key" lines; with no default user cloud-init only
# accepts lines for the user "cloudinit" (e.g. ssh-keys=cloudinit:ssh-ed25519 ...).
datasource_list: [GCE]
disable_root: false
ssh_deletekeys: false
ssh_genkeytypes: []
