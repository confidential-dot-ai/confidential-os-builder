# Profile: gcp
#
# Opt-in Google Compute Engine image. Compose after ssh, general-purpose and attest
# with kernel/gcp.config (recipe `gcp` in ci/images.json). See
# docs/CLOUD.md for provisioning, ACPI policy and packaging.
#
# Console: the cloud serial port (ttyS0) carries boot output; there is no
# serial login. Selecting this profile changes the measurement.
#
# init_on_free=0: GCP ONLY. With init_on_free on (the hardening default,
# CONFIG_INIT_ON_FREE_DEFAULT_ON=y), this kernel resets inside the TDX MapGPA
# hypercall that converts the 1 GiB SWIOTLB buffer to shared memory, and GCE
# boots it again in a loop. Appending only init_on_free=0 to the same UKI
# boots and attests (single-variable test, 2026-10-11). Kernel version, GCC
# plugins, UBSAN and compiler were ruled out. The mechanism is NOT known, so
# this is a workaround, not a fix; init_on_alloc stays on.

[Content]
KernelCommandLine=console=ttyS0,115200n8 init_on_free=0
