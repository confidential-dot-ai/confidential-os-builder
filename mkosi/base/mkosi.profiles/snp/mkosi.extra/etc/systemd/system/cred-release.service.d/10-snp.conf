# SEV-SNP override for the c8s profile's TDX cred-release.service. Retargets
# only the platform: cred-release takes an explicit --platform (no auto-probe)
# and reads that platform's quote device. Everything else (the CA-wait
# ExecStartPre, timeouts, sandboxing) is inherited from the base unit.
[Service]
# Reset the inherited ExecStart before re-setting it; a drop-in appends
# otherwise and systemd would run both the TDX and SNP invocations.
ExecStart=
ExecStart=/usr/local/bin/c8s cred-release \
    --listen :8443 \
    --attestation-api-url http://127.0.0.1:8400 \
    --platform snp \
    --cert-ttl 24h \
    --cert-org system:masters \
    --cert-cn operator
# SNP reads its report via /dev/sev-guest; reset the inherited TDX allow so the
# node is not granted a device it never uses.
DeviceAllow=
DeviceAllow=/dev/sev-guest rwm
