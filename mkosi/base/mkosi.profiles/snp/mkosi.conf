# Profile: snp
#
# Retargets the c8s node image from Intel TDX to AMD SEV-SNP. Compose it
# AFTER the c8s profile (mkosi merges profile extra-trees in order, so a
# later profile's files win):
#
#   bin/confos build --profile gpu --profile attest-gpu \
#       --profile c8s --profile snp --platform snp ...
#
# or via the entrypoint: C8S_SNP=1 bin/build-c8s.
#
# The image is otherwise identical to the TDX build. attestation-api already
# probes /dev/sev-guest and /dev/tdx_guest at runtime (attest profile,
# platforms = ["snp", "tdx"]), and every SEV-SNP guest kernel symbol
# (CONFIG_AMD_MEM_ENCRYPT, CONFIG_SEV_GUEST, CONFIG_VIRTIO_IOMMU) is already
# built in via kernel/required.config, so this profile carries no kernel
# fragment and no package delta.
#
# The one runtime difference is cred-release: it takes an explicit --platform
# (there is no auto-probe) and reads the platform's quote device, so this
# profile drops in an SNP override. Everything else on the node —
# nri-image-policy, ratls-mesh, policy-monitor — resolves its platform through
# attestation-api and needs no change.
#
# The IGVM launch platform (`--platform snp` to `confos build`) is a separate
# switch from cred-release's flag; the entrypoint sets both together.
