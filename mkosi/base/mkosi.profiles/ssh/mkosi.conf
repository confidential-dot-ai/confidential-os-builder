# Profile: ssh
#
# Bakes an OpenSSH server into the image. Composable with other profiles —
# e.g. `bin/confos build --profile attest --profile ssh` produces the same
# image the attest profile used to produce before SSH was split out.
#
# SSH host keys are stripped from the final image to keep builds reproducible;
# the systemd-provided ssh-keygen-on-first-boot generator will recreate them
# on first boot. They land on writable runtime state either way (unattested):
# under the default immutable layout /etc/ssh is the one directory below /etc
# with a state overlay, kept writable exactly for this; under the mutable
# posture they land on the whole-root overlay.
#
# Note logging in still needs an account: the immutable layout can't create
# users at runtime (read-only /etc/passwd), so bake credentials at build
# time or compose with the mutable profile for user-data-created users.

[Content]
Packages=
    openssh-server
