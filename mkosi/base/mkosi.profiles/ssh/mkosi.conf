# Profile: ssh
#
# Bakes an OpenSSH server into the image. Composable with other profiles —
# e.g. `bin/confos build --profile attest --profile ssh` produces the same
# image the attest profile used to produce before SSH was split out.
#
# SSH host keys are stripped from the final image to keep builds reproducible;
# the systemd-provided ssh-keygen-on-first-boot generator recreates them on
# first boot, onto the /etc/ssh state overlay this profile declares in
# mkosi.extra/usr/lib/confai/state.d (unattested). Logging in still needs a
# baked account — see the users note in mkosi.extra/etc/cloud/cloud.cfg.d.

[Content]
Packages=
    openssh-server
