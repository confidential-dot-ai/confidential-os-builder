# Profile: ssh
#
# Bakes an OpenSSH server into the image. Composable with other profiles —
# e.g. `bin/confos build --profile attest --profile ssh` produces the same
# image the attest profile used to produce before SSH was split out.
#
# SSH host keys are removed from the image for reproducible builds.
# ssh-keygen-on-first-boot creates fresh keys in this profile's unattested
# /etc/ssh state overlay, which also makes the SSH configuration writable at
# runtime. The image still needs a baked login account; see the users note in
# mkosi.extra/etc/cloud/cloud.cfg.d.

[Content]
Packages=
    openssh-server
