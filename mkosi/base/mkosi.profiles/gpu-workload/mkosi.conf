# Opt-in mutable GPU workload environment; compose with gpu, attest-gpu, ssh
# and kernel/gpu-workload.config. Hardened profiles are unchanged.
# mkosi.sync stages pinned CUDA/NCCL inputs; mkosi.postinst builds nccl-tests.

[Content]
CleanPackageMetadata=no
Packages=
    build-essential
    ca-certificates
    containerd
    docker.io
    git
    jq
    libopenmpi-dev
    numactl
    nftables
    openmpi-bin
    pciutils
    procps
    python3-pip
    python3-venv
    runc
    systemd-timesyncd

[Build]
ToolsTreePackages=binutils,curl,xz-utils
