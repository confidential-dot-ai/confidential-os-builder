# Profile: azure
#
# Opt-in Azure image. Compose after ssh, general-purpose and attest
# with kernel/azure.config (recipe `azure` in ci/images.json). See
# docs/CLOUD.md for provisioning, ACPI policy and packaging.
#
# Console: the cloud serial port (ttyS0) carries boot output; there is no
# serial login. Selecting this profile changes the measurement.

[Content]
KernelCommandLine=console=ttyS0,115200n8
