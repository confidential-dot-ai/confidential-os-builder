# Replace the base's measured NoCloud seed with the Azure datasource.
# The SSH key comes from cloud metadata and is NOT launch-measured: the cloud
# control plane decides who can log in. Use the opkeydata disk path (TDX
# RTMR[3] binding) where that matters.
# Azure passes the admin SSH key in ovf-env.xml / IMDS. No account is
# created (users: [] in the base); the key is installed for root.
datasource_list: [Azure]
disable_root: false
ssh_deletekeys: false
ssh_genkeytypes: []
