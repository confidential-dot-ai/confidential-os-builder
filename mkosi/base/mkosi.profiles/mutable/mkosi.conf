# Profile: mutable
#
# Opts out of the default immutable-root layout. The initrd mounts the
# legacy whole-root overlay instead, so every path is writable at runtime —
# `apt install`, `systemctl enable`, cloud-init writes to /etc all work —
# and, by the same token, every path can be shadowed by any root process,
# /usr/local/bin/attestation-api included. See the layout comment in
# mkosi/initrd/mkosi.extra/init and docs/THREAT_MODEL.md.
#
# The switch is one parameter on the measured kernel cmdline, so selecting
# this profile changes the launch measurement: a verifier can always tell a
# mutable image from an immutable one. Do not accept mutable measurements
# for workloads whose attestation story depends on runtime immutability.
#
# Compose it wherever runtime mutation of the measured tree is genuinely
# wanted, e.g. the tutorial image that apt-installs Caddy at boot:
#   bin/confos build web --profile mutable --cloud-init examples/caddy.yaml

[Content]
KernelCommandLine=confai.volatile=overlay
