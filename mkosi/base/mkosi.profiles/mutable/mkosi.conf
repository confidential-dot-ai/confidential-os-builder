# Profile: mutable
#
# Opts out of the default immutable root: the initrd mounts the legacy
# whole-root overlay, so runtime `apt install`, `systemctl enable` and
# cloud-init writes to /etc work again — and any root process can shadow
# any measured file, attestation-api included. The switch is one parameter
# on the measured cmdline, so the relaxed posture is always visible to a
# verifier. Rationale: docs/THREAT_MODEL.md. Example — the tutorial image
# that apt-installs Caddy at boot:
#   bin/confos build web --profile mutable --cloud-init examples/caddy.yaml

[Content]
KernelCommandLine=confai.volatile=overlay
