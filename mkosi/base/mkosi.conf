[Config]
MinimumVersion=26

[Distribution]
# One pin for every pocket — apt (>=2.7.11) rewrites main, updates, AND
# security to snapshot.ubuntu.com at this timestamp; the raw Mirror= URL
# left resolute-security live and drifting (#85).
Snapshot=20260430T000000Z
Architecture=x86-64
Distribution=ubuntu
Release=resolute
Repositories=universe
# Pin apt mirror to a point-in-time snapshot for reproducible builds.
# Bump this timestamp deliberately to pick up security updates.

[Build]
EnvironmentFiles=mkosi.env
Incremental=false
# ToolsTree settings live in mkosi.conf.d/tools.conf, which CI hashes for the tools cache key.

[Content]
Bootable=true
SourceDateEpoch=0
CleanPackageMetadata=yes
WithDocs=false
Timezone=UTC
Ssh=never
Packages=
    apt
    bash
    ca-certificates
    cloud-init
    cloud-guest-utils
    conntrack
    curl
    dbus-broker
    dpkg
    ethtool
    gpgv
    grep
    gzip
    iproute2
    kmod
    libseccomp2
    login
    mount
    polkitd
    sed
    socat
    sudo
    systemd
    systemd-boot
    systemd-boot-efi
    systemd-resolved
    systemd-sysv
    tzdata
    udev
    util-linux
# No `console=` in the base cmdline.
#
# `console=<name>` in the cmdline routes kernel printk to <name> AND tells
# systemd to expect a working primary console. Under KubeVirt v1.9's default
# VMI device layout, no virtio-console device is attached (only isa-serial
# for ttyS0 + a virtio-serial channel for the guest-agent), so `console=hvc0`
# names a device that never registers. The kernel/systemd stack blocks on
# the missing console during early boot — the guest never reaches
# multi-user.target, network never comes up, no packets ever leave the
# guest. `confos run` under raw QEMU worked because it explicitly attaches a
# virtconsole to hvc0.
#
# Leaving `console=` unset means the kernel doesn't route printk anywhere
# and doesn't wait on a missing device. `confos run` still works because
# systemd's serial-getty@hvc0.service enables agetty on /dev/hvc0 whenever
# the device exists at runtime, independent of the cmdline. KubeVirt hosts
# work because there's nothing to wait for. The dev profile re-adds
# `console=ttyS0 console=hvc0` for observability when a developer opts in.
#
# Attack-surface note: this REDUCES surface. Not routing printk to a serial
# port means the host can't read guest kernel messages in either the
# KubeVirt or raw-QEMU case. The dev profile is the explicit opt-in for
# host-visible boot logs.
# page_alloc.shuffle=1: CONFIG_SHUFFLE_PAGE_ALLOCATOR only makes page
# free-list shuffling *available* — without this param (or memory-side
# caches, which VMs don't have) it stays inert. See the KSPP block in
# kernel/hardening.config.
#
# dummy.numdummies=0: the dummy driver is built in (CONFIG_DUMMY=y, kept for
# Cilium's benefit) and its module_init creates `numdummies` links — default 1
# — so every guest boots with a dummy0 that is state DOWN, qdisc noop and
# permanently carrier-less. cloud-init classifies it as an ethernet NIC and
# writes dhcp4/dhcp6 for it into /etc/netplan/50-cloud-init.yaml; netplan's
# generator then hands `-i dummy0` to systemd-networkd-wait-online, which
# blocks for its full 120s timeout and exits 1 on every boot, delaying
# everything ordered After=network-online.target. The Kind=!dummy match in
# mkosi.extra/etc/systemd/network/80-dhcp.network only stops *networkd* from
# managing the link; it cannot stop cloud-init from enumerating it. Setting
# numdummies=0 keeps the driver (`ip link add type dummy` still works on
# demand) while creating no link at boot, which removes the input to that
# whole chain.
KernelCommandLine=systemd.condition-first-boot=no page_alloc.shuffle=1 dummy.numdummies=0

[Output]
Format=disk
Seed=d4f09d27-7e4e-4b1a-9c3a-deadbeef0001
SplitArtifacts=uki,roothash

[Validation]
Checksum=yes

[Runtime]
TPM=false
Firmware=uefi
VSock=false
