[Distribution]
# One pin for every pocket — apt (>=2.7.11) rewrites main, updates, AND
# security to snapshot.ubuntu.com at this timestamp; the raw Mirror= URL
# left resolute-security live and drifting (#85).
Snapshot=20260430T000000Z
Architecture=x86-64
Distribution=ubuntu
Release=resolute
# Pin apt mirror to a point-in-time snapshot for reproducible builds; bump deliberately (moves the initrd bytes).

[Content]
Bootable=false
SourceDateEpoch=0
CleanPackageMetadata=yes
WithDocs=false
Packages=
    cryptsetup-bin
    e2fsprogs
    zstd
    mount
    util-linux
    util-linux-extra
    bash

[Output]
Format=cpio
CompressOutput=gzip
Seed=d4f09d27-7e4e-4b1a-9c3a-deadbeef0002
