[Distribution]
Architecture=x86-64
Distribution=ubuntu
Release=resolute
# No Mirror=/Snapshot= here: build-time apt sources come whole from
# mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources, which pins every
# pocket to snapshot.ubuntu.com by URI (#96).

[Content]
Bootable=false
SourceDateEpoch=0
CleanPackageMetadata=yes
WithDocs=false
Packages=
    cryptsetup-bin
    e2fsprogs
    zstd
    mount
    util-linux
    util-linux-extra
    bash

[Output]
Format=cpio
CompressOutput=gzip
Seed=d4f09d27-7e4e-4b1a-9c3a-deadbeef0002
