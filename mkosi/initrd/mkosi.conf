[Distribution]
Architecture=x86-64
Distribution=ubuntu
Release=resolute
# Apt sources ship whole in mkosi.sandbox — every pocket snapshot-pinned (#96).

[Build]
PackageCacheDirectory=../mkosi.pkgcache
CacheDirectory=mkosi.cache
Incremental=false

[Content]
Bootable=false
SourceDateEpoch=0
CleanPackageMetadata=yes
WithDocs=false
Packages=
    cryptsetup-bin
    e2fsprogs
    zstd
    mount
    util-linux
    util-linux-extra
    bash

[Output]
OutputDirectory=mkosi.output
Format=cpio
CompressOutput=gzip
Seed=d4f09d27-7e4e-4b1a-9c3a-deadbeef0002
