[Unit]
# KubeVirt reports the VMI ready before NVIDIA has finished establishing and
# holding every confidential GPU session. An early nvidia-smi from SSH can
# consume and tear down an unheld session, leaving that GPU unusable until the
# next FLR. Do not expose SSH until the measured GPU readiness path completes.
After=nvidia-cc-ready.service
Wants=nvidia-cc-ready.service
