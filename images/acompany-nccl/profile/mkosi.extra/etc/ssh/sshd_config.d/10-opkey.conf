# Trust the launch-bound operator key for SSH logins.
#
# The measured initrd stages the `pubkey` file from an ISO labelled
# "opkeydata" read-only at /run/confai/operator-pubkey and extends
# SHA-384 of those exact bytes into TDX RTMR[3] before switch_root
# (mkosi/initrd/mkosi.extra/init). Put an OpenSSH public key line in
# that file and sshd accepts it for every account (root, acompany-test).
# A verifier proves which key the guest trusts by checking
# rtmr3 == SHA384(0x00*48 || SHA384(pubkey)); no key in the image, no
# console, and no cloud-init path can add another. Without an opkeydata
# disk the file is absent and only the (empty) per-user file applies.
AuthorizedKeysFile /run/confai/operator-pubkey .ssh/authorized_keys
