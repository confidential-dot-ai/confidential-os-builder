# Acompany's native NCCL qualification layer. Heavy NVIDIA artifacts and the
# pinned nccl-tests source are staged by mkosi.sync into the measured root.

[Content]
CleanPackageMetadata=no
Packages=
    build-essential
    ca-certificates
    git
    jq
    libopenmpi-dev
    numactl
    openmpi-bin
    pciutils
    procps
    python3-pip
    python3-venv

[Build]
ToolsTreePackages=binutils,curl,xz-utils
