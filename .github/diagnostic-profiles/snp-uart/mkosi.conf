# Separately measured, Internal-only KubeVirt boot diagnostics.
# Pair with kernel/dev.config. The platform exposes an 8250 UART at COM1.
# Base hardening and verity parameters remain in the native mkosi command line.
[Content]
KernelCommandLine=console=ttyS0,115200n8 earlycon=uart8250,io,0x3f8,115200n8 loglevel=7 ignore_loglevel
