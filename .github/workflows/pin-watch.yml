# Watches the two measured-input pins that go stale silently and opens the
# bump PR for review — never merges: every bump here rolls measurements, so
# a human owns the merge (docs/VERSIONING.md). Born from 6.16 going EOL on
# kernel.org unnoticed: no backports reached kernel/version for weeks and
# nothing failed.
#
# PRs opened with the default Actions token trigger no CI (GitHub suppresses
# runs for GITHUB_TOKEN-created events). Configure a PIN_WATCH_TOKEN secret
# (a fine-grained PAT with contents+PR write) to get CI on the bump PRs;
# until then, close/reopen a bump PR by hand to run its checks. Creating
# PRs also needs "Allow GitHub Actions to create and approve pull requests"
# enabled in the repo's Actions settings.
name: pin watch

on:
  schedule:
    - cron: "17 6 * * 1" # weekly; both steps are no-ops when nothing drifted
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  GH_TOKEN: ${{ secrets.PIN_WATCH_TOKEN || github.token }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Configure the bot identity
        run: |
          git config user.name "pin-watch"
          git config user.email "actions@github.com"

      # Open (or refresh) a PR carrying whatever the caller staged on a
      # branch. Force-push keeps an open PR current when upstream moves
      # again, and recovers the orphaned-branch case where a previous run
      # pushed but pr create failed (the branch alone must not gate reruns).
      - name: Define open_pr helper
        run: |
          cat > /tmp/open_pr <<'SH'
          open_pr() { # <branch> <title> <body>
            git checkout -b "$1"
            git commit -am "$2"
            git push -f origin "$1"
            if [ -z "$(gh pr list --head "$1" --state open --json number --jq '.[0].number')" ]; then
              gh pr create --title "$2" --body "$3"
            fi
            git checkout -
          }
          SH

      - name: Snapshot — age nag
        # The apt snapshot timestamp is the deliberate act that picks up
        # security updates (docs/REPRODUCIBILITY.md) — nag with a ready PR
        # once the base pin is >35 days old. Only sources carrying the base
        # pin's exact timestamp move (kernel-builder is deliberately skewed
        # behind it — see the CHANGELOG on per-lineage kernel toolchains —
        # and a blanket rewrite would silently collapse that skew).
        run: |
          set -euo pipefail
          source /tmp/open_pr
          base=mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources
          cur=$(sed -n 's#^URIs: https://snapshot\.ubuntu\.com/ubuntu/##p' "$base")
          age=$(( ( $(date -u +%s) - $(date -u -d "${cur%%T*}" +%s) ) / 86400 ))
          [ "$age" -gt 35 ] || exit 0
          new=$(date -u -d '1 day ago' +%Y%m%dT000000Z)
          sed -i "s/${cur}/${new}/" mkosi/*/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources
          moved=$(git diff --name-only | paste -sd' ' -)
          open_pr "pin-watch/snapshot" \
            "mkosi: bump the apt snapshot pin to ${new} — ${age} days of security updates" \
            "Automated pin-watch bump ${cur} -> ${new} in: ${moved} (the host-deps closure follows the base pin; sources deliberately skewed behind base keep their own timestamps). Rolls measurements — package versions move to the new snapshot; if the kernel-config drift gate trips, regenerate the snapshot lockfile here. Merge deliberately, ideally batched with other pending rolls."
      - name: Kernel — patch drift or EOL
        # Patch drift on the pinned branch -> bump PR with the digest taken
        # from kernel.org's signed sha256sums.asc (an independent checksum,
        # matching the trust model of src/kernel/fetch.rs — this workflow
        # must never mint a pin by hashing its own download). Branch gone
        # from releases.json -> EOL: no PR can fix that, so fail red and
        # stay red weekly until a human moves the branch.
        run: |
          set -euo pipefail
          source /tmp/open_pr
          . kernel/version
          branch="${LINUX_VERSION%.*}"
          # A series' first release is two-part (6.17, no .0): it IS its
          # own branch; stripping past the last dot would yield "6" and
          # match every 6.x series below.
          case "$branch" in *.*) ;; *) branch="$LINUX_VERSION";; esac
          latest=$(curl -fsSL --retry 5 --retry-delay 5 https://www.kernel.org/releases.json |
            jq -r --arg b "$branch." '[.releases[] | select(.moniker == "stable" or .moniker == "longterm") | .version | select(. + "." | startswith($b))] | first // empty')
          if [ -z "$latest" ]; then
            echo "::error::kernel branch ${branch} is EOL on kernel.org — no more backports reach the ${LINUX_VERSION} pin; move to a maintained branch (measurement roll)" >&2
            exit 1
          fi
          [ "$latest" != "$LINUX_VERSION" ] || exit 0
          major="${latest%%.*}"
          sha=$(curl -fsSL --retry 5 --retry-delay 5 "https://cdn.kernel.org/pub/linux/kernel/v${major}.x/sha256sums.asc" |
            grep -E "  linux-${latest}\.tar\.xz$" | cut -d' ' -f1)
          [ -n "$sha" ] || { echo "::error::linux-${latest}.tar.xz missing from sha256sums.asc" >&2; exit 1; }
          printf 'LINUX_VERSION=%s\nLINUX_TARBALL_SHA256=%s\n' "$latest" "$sha" > kernel/version
          open_pr "pin-watch/kernel" \
            "kernel: bump to ${latest} — stable backports on the pinned branch" \
            "Automated pin-watch bump ${LINUX_VERSION} -> ${latest}; the tarball digest comes from kernel.org's signed sha256sums.asc, not from hashing a download. Rolls measurements; if CI's kernel-config drift gate trips, regenerate the snapshot lockfile in this PR before merging."

