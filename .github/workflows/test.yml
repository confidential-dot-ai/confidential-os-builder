name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

permissions: read-all

env:
    CARGO_TERM_COLOR: always

jobs:
    kernel-checksum:
        name: Test kernel.org checksum verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - run: bash .github/scripts/tests/test-kernel-checksum.sh
            - run: bash .github/scripts/tests/test-kernel-release.sh

    immutable-root:
        name: Immutable root regression tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - name: Install snapshot-pinned cloud-init
              run: bin/host-deps cloud-init
            - name: Test seed isolation and state overlays
              run: sudo tests/immutable-root.sh

    trusted-aml:
        name: Test kernel AML enforcement
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
            - name: Setup uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  enable-cache: false
            - name: Setup mkosi
              uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27
            - name: Install nspawn
              run: bin/host-deps systemd-container
            - name: Cache kernel-builder tools tree
              # Same key as base.yml: the harness runs in the production tree.
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: mkosi/kernel-builder/mkosi.output
                  key: ${{ runner.os }}-tools-v2-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**') }}
            - name: Cache kernel tarball
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: output/acpi/cache
                  key: ${{ runner.os }}-kernel-tarball-${{ hashFiles('kernel/version') }}
            - name: Boot control and enforcing kernels
              run: tests/acpi/run.sh --jobs 4
            - name: Lint the kernel patch with upstream checkpatch
              run: |
                  . kernel/version
                  # Read stdin so checkpatch does not treat the tracked patch as a source file.
                  "output/acpi/linux-${LINUX_VERSION}/scripts/checkpatch.pl" --no-tree --no-signoff - < kernel/patches/0001-acpi-trusted-aml.patch
            - name: Make root-owned trees cache-safe
              if: always()
              run: sudo chown -R "$(id -u):$(id -g)" mkosi/kernel-builder/mkosi.output output/acpi || true
            - name: Upload AML test evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: trusted-aml-results
                  path: |
                      output/acpi/results/*.json
                      output/acpi/results/*.log
                      output/acpi/results/*.config
                  if-no-files-found: warn

    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans sources licenses
        # Prevent sudden announcement of a new advisory from failing ci:
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        steps:
            - name: Check out repo
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Install cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check ${{ matrix.checks }}

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
              with:
                  components: rustfmt, clippy
            - name: Run linters
              run: ./bin/lint

    run-tests:
        name: Run tests
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                runs-on:
                    - macos-latest # mac-arm
                    - ubuntu-latest # linux-x86
                    - ubuntu-24.04-arm # linux-arm

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
            - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
              with:
                tool: nextest
            - run: ./bin/test

    build:
        name: Build Confidential OS Builder
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
            - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
            - run: cargo build --release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: confos
                  path: target/release/confos
                  if-no-files-found: error
