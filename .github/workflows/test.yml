name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

permissions: read-all

env:
    CARGO_TERM_COLOR: always

jobs:
    kernel-checksum:
        name: Test kernel.org checksum verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash .github/scripts/tests/test-kernel-checksum.sh
            - run: bash .github/scripts/tests/test-kernel-release.sh

    immutable-root:
        name: Immutable root regression tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install snapshot-pinned cloud-init
              run: bin/host-deps cloud-init
            - name: Test seed isolation and state overlays
              run: sudo tests/immutable-root.sh

    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans sources licenses
        # Prevent sudden announcement of a new advisory from failing ci:
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        steps:
            - name: Check out repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check ${{ matrix.checks }}

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  components: rustfmt, clippy
            - name: Run linters
              run: ./bin/lint

    run-tests:
        name: Run tests
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                runs-on:
                    - macos-latest # mac-arm
                    - ubuntu-latest # linux-x86
                    - ubuntu-24.04-arm # linux-arm

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
              with:
                tool: nextest
            - run: ./bin/test

    build:
        name: Build Confidential OS Builder
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - run: cargo build --release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: confos
                  path: target/release/confos
                  if-no-files-found: error
