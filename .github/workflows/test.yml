name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

permissions: read-all

env:
    CARGO_TERM_COLOR: always

jobs:
    kernel-checksum:
        name: Test kernel.org checksum verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash .github/scripts/tests/test-kernel-checksum.sh
            - run: bash .github/scripts/tests/test-kernel-release.sh

    immutable-root:
        name: Immutable root regression tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install snapshot-pinned cloud-init
              run: bin/host-deps cloud-init
            - name: Test seed isolation and state overlays
              run: sudo tests/immutable-root.sh

    trusted-aml:
        name: Test kernel AML enforcement
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - name: Setup uv
              uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
              with:
                  enable-cache: false
            - name: Setup mkosi
              uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27
            - name: Install nspawn
              run: bin/host-deps systemd-container
            - name: Cache the harness tools tree
              # The production tree plus QEMU and Python, built beside it by
              # `confos kernel-source`; base.yml's production cache stays
              # free of harness packages.
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: mkosi/kernel-builder/mkosi.output-acpi
                  key: ${{ runner.os }}-tools-acpi-v1-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**') }}
            - name: Cache kernel tarball
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: output/acpi/cache
                  key: ${{ runner.os }}-kernel-tarball-${{ hashFiles('kernel/version') }}
            - name: Prepare the patched kernel source
              run: bin/confos kernel-source --output output/acpi
            - name: Lint the kernel patch with upstream checkpatch
              # Before the long boot step so a style failure surfaces first.
              run: |
                  . kernel/version
                  # Read stdin so checkpatch does not treat the tracked patch as a source file.
                  "output/acpi/linux-${LINUX_VERSION}/scripts/checkpatch.pl" --no-tree --no-signoff - < kernel/patches/0001-acpi-trusted-aml.patch
            - name: Boot control and enforcing kernels
              run: tests/acpi/run.sh --jobs 4
            - name: Make root-owned trees cache-safe
              # The post-job cache tar runs unprivileged; mkosi builds the
              # tools tree as root. output/acpi/cache is written unprivileged.
              if: always()
              run: sudo chown -R "$(id -u):$(id -g)" mkosi/kernel-builder/mkosi.output-acpi || true
            - name: Upload AML test evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: trusted-aml-results
                  path: |
                      output/acpi/results/*.json
                      output/acpi/results/*.log
                      output/acpi/results/*.config
                  if-no-files-found: warn

    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans sources licenses
        # Prevent sudden announcement of a new advisory from failing ci:
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        steps:
            - name: Check out repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check ${{ matrix.checks }}

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  components: rustfmt, clippy
            - name: Run linters
              run: ./bin/lint

    run-tests:
        name: Run tests
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                runs-on:
                    - macos-latest # mac-arm
                    - ubuntu-latest # linux-x86
                    - ubuntu-24.04-arm # linux-arm

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
              with:
                tool: nextest
            - run: ./bin/test

    build:
        name: Build Confidential OS Builder
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - run: cargo build --release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: confos
                  path: target/release/confos
                  if-no-files-found: error
