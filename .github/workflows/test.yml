name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:

permissions: read-all

env:
    CARGO_TERM_COLOR: always

jobs:
    general-purpose-gpu:
        name: General-purpose profile and cache regressions
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: |
                  python3 tests/image_profiles.py
                  python3 tests/ci_images.py
                  python3 tests/gpu_module_cache.py
                  python3 tests/host_deps.py

    kernel-checksum:
        name: Test kernel.org checksum verification
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: bash .github/scripts/tests/test-kernel-checksum.sh
            - run: bash .github/scripts/tests/test-kernel-release.sh

    immutable-root:
        name: Immutable root regression tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install snapshot-pinned cloud-init
              uses: ./.github/actions/host-deps
              with:
                  packages: cloud-init
            - name: Test seed isolation and state overlays
              run: sudo tests/immutable-root.sh

    trusted-aml:
        name: Test kernel AML enforcement
        runs-on: ubuntu-latest
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - name: Setup uv
              uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: false
            - name: Setup mkosi
              uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27
            - name: Install nspawn
              uses: ./.github/actions/host-deps
              with:
                  packages: systemd-container
            - name: Restore shared build inputs
              uses: ./.github/actions/build-cache
              with:
                  phase: restore
                  variant: acpi
                  compiled-kernel: 'false'
            - name: Restore the harness tools tree
              id: acpi-tools
              # The production tree plus QEMU and Python, built beside it by
              # `confos kernel-source`; base.yml's production cache stays
              # free of harness packages.
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: mkosi/kernel-builder/mkosi.output-acpi
                  key: ${{ runner.os }}-tools-acpi-v2-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**', 'src/commands/kernel.rs') }}
            - name: Prepare the patched kernel source
              id: acpi-source
              run: |
                  mkdir -p output/kernel/cache output/acpi
                  ln -s ../kernel/cache output/acpi/cache
                  bin/confos kernel-source --output output/acpi
            - name: Save shared inputs before running tests
              if: always()
              uses: ./.github/actions/build-cache
              with:
                  phase: save
                  variant: acpi
                  compiled-kernel: 'false'
                  kernel-ready: ${{ steps.acpi-source.outcome == 'success' }}
            - name: Save completed harness tools before running tests
              if: ${{ always() && hashFiles('mkosi/kernel-builder/mkosi.output-acpi/.confos-tools-stamp') != '' && steps.acpi-tools.outputs.cache-hit != 'true' }}
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: mkosi/kernel-builder/mkosi.output-acpi
                  key: ${{ steps.acpi-tools.outputs.cache-primary-key }}
            - name: Lint the kernel patch with upstream checkpatch
              # Before the long boot step so a style failure surfaces first.
              run: |
                  . kernel/version
                  # Read stdin so checkpatch does not treat the tracked patch as a source file.
                  "output/acpi/linux-${LINUX_VERSION}/scripts/checkpatch.pl" --no-tree --no-signoff - < kernel/patches/0001-acpi-trusted-aml.patch
            - name: Boot control and enforcing kernels
              run: tests/acpi/run.sh --jobs 4
            - name: Upload AML test evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: trusted-aml-results
                  path: |
                      output/acpi/results/*.json
                      output/acpi/results/*.log
                      output/acpi/results/*.config
                  if-no-files-found: warn

    cargo-deny:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                checks:
                    - advisories
                    - bans sources licenses
        # Prevent sudden announcement of a new advisory from failing ci:
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        steps:
            - name: Check out repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check ${{ matrix.checks }}

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  components: rustfmt, clippy
            - name: Run linters
              run: ./bin/lint

    run-tests:
        name: Run tests
        runs-on: ${{ matrix.runs-on }}
        strategy:
            fail-fast: false
            matrix:
                runs-on:
                    - macos-latest # mac-arm
                    - ubuntu-latest # linux-x86
                    - ubuntu-24.04-arm # linux-arm

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
              with:
                tool: nextest
            - run: ./bin/test

    build:
        name: Build Confidential OS Builder
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
            - run: cargo build --release
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: confos
                  path: target/release/confos
                  if-no-files-found: error
