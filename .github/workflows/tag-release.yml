# Tags a release when its PR lands. A push to main that raises the package
# version in Cargo.toml gets the tag vX.Y.Z on exactly that commit, and the
# tag starts release.yml (cargo-dist), which builds and publishes. Consumers
# pin confos by commit, so the tag never goes anywhere but the commit that
# changed the version; a push that leaves the version alone is a no-op.
#
# The tag is pushed with the pin-watch GitHub App token, with no
# GITHUB_TOKEN fallback: a tag pushed with GITHUB_TOKEN starts no workflow,
# so the release would silently never build.
name: tag release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'confidential-dot-ai/confidential-os-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this push is a release
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # For package_field and newer_than.
          source .github/scripts/prepare-release

          version=$(package_field Cargo.toml version)
          git fetch --no-tags --depth=1 origin "$BEFORE"
          git show "$BEFORE:Cargo.toml" >"$RUNNER_TEMP/Cargo.toml.before"
          previous=$(package_field "$RUNNER_TEMP/Cargo.toml.before" version)

          if [ "$version" = "$previous" ]; then
            echo "tag-release: version is still $version; nothing to tag"
            exit 0
          fi
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "tag-release: $version is not a plain X.Y.Z; tag it by hand" >&2
            exit 1
          }
          newer_than "$version" "$previous" || {
            echo "tag-release: version went from $previous to $version" >&2
            exit 1
          }
          grep -q "^## \[$version\] — [0-9-]*\$" CHANGELOG.md || {
            echo "tag-release: CHANGELOG.md has no dated [$version] section" >&2
            exit 1
          }

          if remote=$(git ls-remote --exit-code origin "refs/tags/v$version^{}" "refs/tags/v$version"); then
            # A re-run after the tag went out: fine if it is on this commit.
            if grep -q "^${GITHUB_SHA}[[:space:]]" <<<"$remote"; then
              echo "tag-release: v$version is already on $GITHUB_SHA"
              exit 0
            fi
            echo "tag-release: v$version already exists on another commit" >&2
            exit 1
          else
            status=$?
            # 2 is "no such ref"; anything else is a failed lookup.
            [ "$status" -eq 2 ] || exit "$status"
          fi
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
      - name: Create GitHub App token
        id: app-token
        if: steps.decide.outputs.tag != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the tag
        if: steps.decide.outputs.tag != ''
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "tag-release"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "confos $TAG" "$GITHUB_SHA"
          git push "https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG"
