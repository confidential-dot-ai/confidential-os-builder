# Tags a release when its PR lands. When a push to main raises the package
# version in Cargo.toml, the first commit of that push carrying the new
# version gets the tag vX.Y.Z, and the tag starts release.yml (cargo-dist),
# which builds and publishes. Consumers pin confos by commit, so the tag
# goes on the commit that changed the version even when the push brought
# later commits with it. Whether a change is a release is decided by
# .github/scripts/release-tag; a push that leaves the version alone is a
# no-op.
#
# The tag is pushed with the pin-watch GitHub App token, with no
# GITHUB_TOKEN fallback: a tag pushed with GITHUB_TOKEN starts no workflow,
# so the release would silently never build.
name: tag release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]

permissions:
  contents: read

jobs:
  tag:
    if: github.repository == 'confidential-dot-ai/confidential-os-builder'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether this push is a release
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git show "$BEFORE:Cargo.toml" >"$RUNNER_TEMP/Cargo.toml.before"

          # Oldest first, so the tag goes on the commit that made the bump.
          tag='' commit=''
          for commit in $(git rev-list --first-parent --reverse "$BEFORE..$GITHUB_SHA"); do
            git show "$commit:Cargo.toml" >"$RUNNER_TEMP/Cargo.toml"
            git show "$commit:CHANGELOG.md" >"$RUNNER_TEMP/CHANGELOG.md"
            tag=$(bash .github/scripts/release-tag "$RUNNER_TEMP/Cargo.toml.before" \
              "$RUNNER_TEMP/Cargo.toml" "$RUNNER_TEMP/CHANGELOG.md")
            [ -z "$tag" ] || break
          done
          if [ -z "$tag" ]; then
            echo "tag-release: the package version did not change; nothing to tag"
            exit 0
          fi

          # Empty when the tag does not exist; a failed lookup fails the step.
          remote=$(git ls-remote origin "refs/tags/$tag^{}")
          if [ -n "$remote" ]; then
            # A re-run after the tag went out: fine if it is on this commit.
            if [ "${remote%%[[:space:]]*}" = "$commit" ]; then
              echo "tag-release: $tag is already on $commit"
              exit 0
            fi
            echo "tag-release: $tag already exists on another commit" >&2
            exit 1
          fi
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - name: Create GitHub App token
        id: app-token
        if: steps.decide.outputs.tag != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the tag
        if: steps.decide.outputs.tag != ''
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          COMMIT: ${{ steps.decide.outputs.commit }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "tag-release"
          git config user.email "actions@github.com"
          git tag -a "$TAG" -m "confos $TAG" "$COMMIT"
          git push "https://x-access-token:$APP_TOKEN@github.com/$GITHUB_REPOSITORY.git" \
            "refs/tags/$TAG"
