name: Build Base Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: "Build for the reproducibility gate: publish nothing, emit evidence."
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      gate:
        required: false
        type: boolean
        default: false
      leg:
        description: "Distinguishes gate artifacts when one caller runs several legs."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

# Legs of one gate run build concurrently; only identical non-gate builds
# collapse. `inputs.*` is null on push, which renders empty — fine, since
# push never runs as a gate.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.sha }}-${{ inputs.gate }}-${{ inputs.leg }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            images=$(bin/ci-images --base "$BEFORE")
          else
            images=$(bin/ci-images --all)
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: select
    if: contains(fromJSON(needs.select.outputs.images), 'base')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # mkosi is the only uv consumer; there is no Python dependency set.
          enable-cache: false

      - name: Setup mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Install build deps (nspawn, TDVF firmware, cpio)
        # Host deps for `confos build`, snapshot-pinned and fail-closed via
        # bin/host-deps (#36) — keep the list in lockstep with bin/setup.
        timeout-minutes: 10
        uses: ./.github/actions/host-deps
        with:
          packages: systemd-container ovmf cpio

      - name: Restore shared image inputs
        uses: ./.github/actions/build-cache
        with:
          phase: restore
          variant: base
          leg: ${{ inputs.leg || 'single' }}

      - name: Build kernel
        id: kernel
        run: bin/confos kernel

      - name: Upload resolved kernel config
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-config-${{ github.sha }}
          path: kernel/config-x86_64.snapshot
          if-no-files-found: error
          overwrite: true

      - name: Cache base image tools
        if: github.ref == 'refs/heads/main' || inputs.gate == true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi/base/mkosi.tools
          key: ${{ runner.os }}-base-tools-${{ hashFiles('mkosi/base/mkosi.conf.d/tools.conf', 'mkosi/base/mkosi.sandbox/**') }}

      - name: Build base image
        if: github.ref == 'refs/heads/main' || inputs.gate == true
        run: bin/confos build

      - name: Save shared inputs even on later failures
        if: always()
        uses: ./.github/actions/build-cache
        with:
          phase: save
          kernel-ready: ${{ steps.kernel.outcome == 'success' }}
          variant: base
          leg: ${{ inputs.leg || 'single' }}

      - name: Make base-only tools cache-readable
        if: always()
        run: |
          if [ -e mkosi/base/mkosi.tools ]; then
            sudo chown -R "$(id -u):$(id -g)" mkosi/base/mkosi.tools
          fi

      - name: Upload measurement evidence (gate)
        # Gate mode ends here: evidence out, nothing published. The report
        # timestamp is metadata rather than a baked byte, so `compare`
        # drops it before diffing the manifest.
        if: inputs.gate == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-base-${{ github.run_id }}${{ inputs.leg && format('-{0}', inputs.leg) || '' }}
          path: |
            output/base/manifest.json
            output/base/roothash
          if-no-files-found: error
          retention-days: 7

      - name: Setup ORAS
        if: github.ref == 'refs/heads/main' && inputs.gate != true
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Push to GHCR
        # Gate legs never publish, even on main: `:base` is the mutable tag
        # consumers pull, and two legs would race on `base-<short sha>`.
        if: github.ref == 'refs/heads/main' && inputs.gate != true
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}"

          # include the needed OVMF firmware in the published files
          cp output/OVMF.fd mkosi/base/mkosi.output/OVMF.fd

          cd mkosi/base/mkosi.output

          # prevent symlink from becoming a second copy of the image
          rm image

          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          oras push "${IMAGE}:base,base-${SHORT_SHA}" \
            --artifact-type application/vnd.confos.image.v1 \
            ./*
