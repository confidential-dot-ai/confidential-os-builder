name: Build Base Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Compute runner-image cache term
        # ImageOS/ImageVersion are runner-process env vars, not workflow env
        # context — ${{ env.ImageOS }} silently renders empty in a key.
        id: image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache host build deps
        # The snapshot pin moves the whole dep closure to snapshot versions,
        # which would re-download it from snapshot.ubuntu.com every run; warm
        # runs reinstall these debs fully offline. The key rotates with the
        # runner image (the closure was resolved against its preinstalled
        # state), the script, and the pin it reads (base mkosi.sources);
        # host-deps validates the cached manifest and falls back to a cold
        # snapshot install on any mismatch, so a stale entry costs time only.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apt-debs
          key: ${{ runner.os }}-host-debs-${{ steps.image.outputs.key }}-${{ hashFiles('bin/host-deps', 'mkosi/base/mkosi.sandbox/etc/apt/sources.list.d/mkosi.sources') }}

      - name: Install build deps (nspawn, TDVF firmware, iasl, cpio)
        # Host deps for `confos build`, snapshot-pinned and fail-closed via
        # bin/host-deps (#36) — keep the list in lockstep with bin/setup.
        timeout-minutes: 10
        run: bin/host-deps --cache-dir apt-debs systemd-container ovmf cpio acpica-tools

      - name: Cache kernel-builder tools tree
        # mkosi.output (image + stamp) is what ensure_tools_tree consumes;
        # mkosi.tools is only an intermediate for building it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi/kernel-builder/mkosi.output
          key: ${{ runner.os }}-tools-v2-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**') }}

      - name: Cache kernel
        # The snapshot lockfile rides the cache: the build rewrites it with
        # the resolved config and fingerprints THAT, so restoring
        # output/kernel without it never matches and the kernel rebuilds
        # every run. hashFiles has no brace expansion, so files are listed.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            output/kernel
            kernel/config-x86_64.snapshot
          key: ${{ runner.os }}-kernel-v2-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**', 'kernel/*') }}

      - name: Build kernel
        run: bin/confos kernel

      - name: Cache base image tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi/base/mkosi.tools
          key: ${{ runner.os }}-base-tools-${{ hashFiles('mkosi/base/mkosi.conf.d/tools.conf', 'mkosi/base/mkosi.sandbox/**') }}

      - name: Cache apt package cache
        # Keeps the image assembly off snapshot.ubuntu.com. conf-only globs:
        # profile mkosi.extra trees carry dangling systemd enablement
        # symlinks, which hashFiles refuses to hash.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi/base/mkosi.pkgcache
          key: ${{ runner.os }}-pkgcache-${{ hashFiles('mkosi/base/mkosi.conf', 'mkosi/base/mkosi.conf.d/*.conf', 'mkosi/base/mkosi.profiles/*/mkosi.conf', 'mkosi/base/mkosi.sandbox/**') }}
          restore-keys: |
            ${{ runner.os }}-pkgcache-

      - name: Build base image
        run: bin/confos build

      - name: Make root-owned trees cache-safe
        # The post-job cache tar runs unprivileged; mkosi builds these as
        # root, so their saves fail without this. Runs after all use.
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            mkosi/kernel-builder/mkosi.output \
            mkosi/base/mkosi.tools \
            mkosi/base/mkosi.pkgcache || true

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Push to GHCR
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}"

          # include the needed OVMF firmware in the published files
          cp output/OVMF.fd mkosi/base/mkosi.output/OVMF.fd

          cd mkosi/base/mkosi.output

          # prevent symlink from becoming a second copy of the image
          rm image

          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          oras push "${IMAGE}:base,base-${SHORT_SHA}" \
            --artifact-type application/vnd.confos.image.v1 \
            ./*
