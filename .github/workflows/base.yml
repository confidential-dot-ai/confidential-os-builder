name: Build Base Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Setup mkosi
        uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26

      - name: Install build deps (nspawn, TDVF firmware, iasl, cpio)
        # Host deps for `confos build` — keep in lockstep with bin/setup.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y systemd-container ovmf cpio acpica-tools

      - name: Cache kernel tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mkosi/kernel-builder/mkosi.tools
          key: ${{ runner.os }}-tools-${{ hashFiles('mkosi/kernel-builder/mkosi.conf', 'mkosi/kernel-builder/mkosi.sandbox/**') }}

      - name: Cache kernel
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: output/kernel
          key: ${{ runner.os }}-kernel-${{ hashFiles('mkosi/kernel-builder/{mkosi.conf,mkosi.tools.manifest}', 'mkosi/kernel-builder/mkosi.sandbox/**', 'kernel/*') }}

      - name: Build kernel
        run: bin/confos kernel

      - name: Cache base image tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: mkosi/base/mkosi.tools
          key: ${{ runner.os }}-tools-${{ hashFiles('mkosi/base/mkosi.conf.d/tools.conf', 'mkosi/base/mkosi.sandbox/**') }}

      - name: Build base image
        run: bin/confos build

      - name: Setup ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1.2.4

      - name: Push to GHCR
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO}"

          # include the needed OVMF firmware in the published files
          cp output/OVMF.fd mkosi/base/mkosi.output/OVMF.fd

          cd mkosi/base/mkosi.output

          # prevent symlink from becoming a second copy of the image
          rm image

          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io \
            -u ${{ github.actor }} --password-stdin
          oras push "${IMAGE}:base,base-${SHORT_SHA}" \
            --artifact-type application/vnd.confos.image.v1 \
            ./*
