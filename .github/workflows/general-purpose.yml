name: Build General-Purpose Images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish reproducible commit tags after hardware acceptance"
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/general-purpose.yml
      - .github/actions/**
      - ci/**
      - firmware/**
      - tests/image_profiles.py
      - tests/ci_images.py
      - tests/gpu_module_cache.py
      - mkosi/**
      - kernel/**
      - src/**
      - crates/**
      - bin/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read
  packages: write

concurrency:
  group: general-purpose-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select affected image recipes
        id: select
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            images=$(bin/ci-images --all --omit-base)
          else
            images=$(bin/ci-images --base "$BEFORE" --omit-base)
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Affected workload images: $images" >> "$GITHUB_STEP_SUMMARY"
      - name: Test profile invariants and GPU-count handling
        run: |
          python3 tests/image_profiles.py
          python3 tests/ci_images.py
          python3 tests/gpu_module_cache.py
          python3 tests/host_deps.py

  build:
    if: needs.validate.outputs.images != '[]'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.images) }}
        leg: [a, b]
    needs: validate
    runs-on: big-build-runner
    timeout-minutes: 60
    env:
      KERNEL_FRAGMENT: ${{ matrix.image == 'general-purpose' && 'general-purpose' || 'general-purpose-gpu' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Setup mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mkosi/base/mkosi.local
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" \
            --password-stdin \
            --registry-config mkosi/base/mkosi.local/oras-auth.json

      - name: Check module-signing configuration before building
        if: matrix.image == 'general-purpose-gpu'
        env:
          MODULE_SIG_KEY_PEM: ${{ secrets.MODULE_SIG_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$MODULE_SIG_KEY_PEM" || { echo 'Missing MODULE_SIG_KEY_PEM secret' >&2; exit 1; }
          key_pub=$(printf '%s\n' "$MODULE_SIG_KEY_PEM" | openssl pkey -pubout 2>/dev/null)
          cert_pub=$(openssl x509 -in kernel/module-signing.crt -pubkey -noout)
          test "$key_pub" = "$cert_pub" || { echo 'Signing key does not match kernel/module-signing.crt' >&2; exit 1; }

      - name: Install host dependencies
        timeout-minutes: 10
        uses: ./.github/actions/host-deps
        with:
          packages: systemd-container ovmf cpio kmod

      - name: Restore shared build caches
        uses: ./.github/actions/build-cache
        with:
          phase: restore
          variant: ${{ matrix.image }}
          leg: ${{ matrix.leg }}
          fragment: kernel/${{ env.KERNEL_FRAGMENT }}.config
          snapshot: kernel/config-x86_64-${{ env.KERNEL_FRAGMENT }}.snapshot
          gpu: ${{ matrix.image == 'general-purpose-gpu' }}

      - name: Build workload kernel
        id: kernel
        run: |
          args=(--kernel-config-fragment "kernel/${KERNEL_FRAGMENT}.config")
          if [ "${{ matrix.image }}" = general-purpose-gpu ]; then
            args+=(--module-signing-cert kernel/module-signing.crt)
          fi
          bin/confos kernel "${args[@]}"

      - name: Verify OCI kernel support
        run: |
          set -euo pipefail
          CONFIG=output/kernel/build/linux-$(sed -n 's/^LINUX_VERSION=//p' kernel/version)/.config
          grep -qx 'CONFIG_BPF_SYSCALL=y' "$CONFIG"
          grep -qx 'CONFIG_BPF_JIT=y' "$CONFIG"
          grep -qx 'CONFIG_CGROUP_BPF=y' "$CONFIG"
          grep -qx 'CONFIG_USER_NS=y' "$CONFIG"
          grep -qx 'CONFIG_VETH=y' "$CONFIG"
          grep -qx 'CONFIG_BRIDGE=y' "$CONFIG"
          grep -qx 'CONFIG_BRIDGE_NETFILTER=y' "$CONFIG"
          grep -qx 'CONFIG_NETFILTER_XT_NAT=y' "$CONFIG"
          grep -qx 'CONFIG_IO_URING=y' "$CONFIG"
          grep -qx 'CONFIG_MSEAL_SYSTEM_MAPPINGS=y' "$CONFIG"
          for symbol in CHECKPOINT_RESTORE KCMP USERFAULTFD FUSE_FS TUN; do
            grep -qx "# CONFIG_${symbol} is not set" "$CONFIG"
          done

      - name: Build measured image from the registered recipe
        # The explicit kernel/driver steps above provide early diagnostics.
        # This wrapper reuses them by fingerprint and is also the local entrypoint.
        env:
          MODULE_SIG_KEY_PEM: ${{ matrix.image == 'general-purpose-gpu' && secrets.MODULE_SIG_KEY_PEM || '' }}
        run: bin/build-image "${{ matrix.image }}"

      - name: Save reusable inputs even on later failures
        if: always()
        uses: ./.github/actions/build-cache
        with:
          phase: save
          kernel-ready: ${{ steps.kernel.outcome == 'success' }}
          variant: ${{ matrix.image }}
          leg: ${{ matrix.leg }}
          fragment: kernel/${{ env.KERNEL_FRAGMENT }}.config
          snapshot: kernel/config-x86_64-${{ env.KERNEL_FRAGMENT }}.snapshot
          gpu: ${{ matrix.image == 'general-purpose-gpu' }}

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.image }}-${{ github.run_id }}-${{ matrix.leg }}
          path: |
            output/${{ matrix.image }}/manifest.json
            output/${{ matrix.image }}/roothash
            kernel/config-x86_64-${{ env.KERNEL_FRAGMENT }}.snapshot
          if-no-files-found: error
          retention-days: 14

      - name: Push candidate artifact
        if: matrix.leg == 'b' && (github.ref == 'refs/heads/main' || inputs.publish == true)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd output/${{ matrix.image }}
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.image }}-${GITHUB_SHA}-candidate" \
            --artifact-type application/vnd.confos.image.v1 \
            disk.raw OVMF.tdx.fd initrd.img manifest.json roothash uki.efi

          # CDI requires a standard OCI image with one tar+gzip layer and the
          # VM disk at disk/disk.raw. Keep the general artifact above for
          # confos pull and publish this deployment-specific representation
          # under a distinct tag.
          cd "$GITHUB_WORKSPACE"
          bin/confos push output/${{ matrix.image }} \
            --cdi \
            --tag "${{ matrix.image }}-${GITHUB_SHA}-candidate-cdi"

  verify-and-promote:
    needs: [validate, build]
    strategy:
      matrix:
        image: ${{ fromJSON(needs.validate.outputs.images) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.image }}-${{ github.run_id }}-*
          path: evidence

      - name: Require identical measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = sorted(Path("evidence").rglob("roothash"))
          manifests = sorted(Path("evidence").rglob("manifest.json"))
          assert len(roots) == 2 and len(manifests) == 2, "two build legs required"
          if len(roots) == 2:
              assert roots[0].read_bytes() == roots[1].read_bytes(), "roothash differs"
          parsed = []
          for path in manifests:
              value = json.loads(path.read_text())
              value.get("build", {}).pop("timestamp", None)
              parsed.append(value)
          if len(parsed) == 2:
              assert parsed[0] == parsed[1], "manifest differs"
          PY

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Promote reproducible artifact
        if: github.ref == 'refs/heads/main' || inputs.publish == true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="${IMAGE}:${{ matrix.image }}-${GITHUB_SHA}-candidate"
          CDI_SRC="${IMAGE}:${{ matrix.image }}-${GITHUB_SHA}-candidate-cdi"
          oras copy "$SRC" "${IMAGE}:${{ matrix.image }}-${GITHUB_SHA}"
          oras copy "$CDI_SRC" "${IMAGE}:${{ matrix.image }}-${GITHUB_SHA}-cdi"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            oras copy "$SRC" "${IMAGE}:${{ matrix.image }}-latest"
            oras copy "$CDI_SRC" "${IMAGE}:${{ matrix.image }}-cdi-latest"
          fi
