# TEMPORARY debug job for #85 — REVERT before merging #86. Runs on push to
# this branch (no workflow_dispatch, which can't fire from a PR branch).
# Builds the kernel twice back to back on one ubuntu-latest runner, each with
# --force so neither hits the cache, and compares the vmlinuz hashes. Same
# host + same inputs isolates in-process nondeterminism from cross-runner
# drift. Reverted before merge; never runs on main.
name: kernel repro debug (TEMP #85)

on:
  push:
    branches: [fix/reproducible-kernel-signing]

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26
      - name: Install sandbox deps
        run: sudo apt-get update -y && sudo apt-get install -y systemd-container diffoscope
      - name: Build confos
        run: cargo build --release
      - name: Build the kernel twice and compare
        run: |
          set -euo pipefail
          echo "nproc=$(nproc)"
          build() {  # $1 = A|B
            ./target/release/confos kernel --force --output "output/kernel-$1"
            cp "output/kernel-$1/vmlinuz" "vmlinuz-$1"
          }
          build A
          build B
          shaA=$(sha256sum vmlinuz-A | awk '{print $1}')
          shaB=$(sha256sum vmlinuz-B | awk '{print $1}')
          {
            echo "### kernel repro (#85)"
            echo "same ubuntu-latest runner, nproc=$(nproc), bare baseline (no fragment)"
            echo "- A: \`$shaA\`"
            echo "- B: \`$shaB\`"
            if [ "$shaA" = "$shaB" ]; then
              echo "- **REPRODUCIBLE on this host** — the gate difference was cross-runner drift."
            else
              echo "- **NONDETERMINISTIC in-process** — same host, same inputs, different output."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "A=$shaA B=$shaB"
          if [ "$shaA" != "$shaB" ]; then
            echo "=== diffoscope (first 300 lines) ==="
            diffoscope vmlinuz-A vmlinuz-B 2>&1 | head -300 || true
          fi
