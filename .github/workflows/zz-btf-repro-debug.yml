# TEMP #85 — verify the pahole -j1 pin: two --force builds of a
# BTF-enabled kernel must now match. Delete once confirmed.
name: btf repro debug (TEMP #85)
on:
  push:
    branches: [fix/btf-determinism]
permissions:
  contents: read
jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - uses: systemd/mkosi@84af20892b61c8e177e391f997ded8b4cb5514f2 # v26
      - run: sudo apt-get update -y && sudo apt-get install -y systemd-container
      - run: cargo build --release
      - name: Two BTF kernels must match
        run: |
          set -euo pipefail
          printf 'CONFIG_DEBUG_INFO=y\nCONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=y\nCONFIG_DEBUG_INFO_BTF=y\n# CONFIG_DEBUG_INFO_BTF_MODULES is not set\n' > /tmp/btf.config
          b() { ./target/release/confos kernel --force --kernel-config-fragment /tmp/btf.config --kernel-builder-package dwarves,python3,pkg-config,zlib1g-dev --output "output/k$1"; }
          b A; b B
          a=$(sha256sum output/kA/vmlinuz|awk '{print $1}'); c=$(sha256sum output/kB/vmlinuz|awk '{print $1}')
          echo "A=$a"; echo "B=$c"
          { echo "### BTF repro (#85, pahole -j1 pinned)"; echo "- A: \`$a\`"; echo "- B: \`$c\`"; } >> "$GITHUB_STEP_SUMMARY"
