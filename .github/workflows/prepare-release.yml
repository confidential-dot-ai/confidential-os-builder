# Opens the release PR for a version you choose: bumps the package version
# and rolls CHANGELOG.md's [Unreleased] entries into a dated section
# (.github/scripts/prepare-release), opening it with a lead paragraph on
# measurements: the summary input if given, else a standard one when any
# entry says it alters or changes measurements. Never merges — a human owns the
# merge. Merging is what releases: tag-release.yml tags the merge commit and release.yml
# publishes from the tag.
#
# Uses the pin-watch GitHub App token, with no GITHUB_TOKEN fallback: a PR
# opened with GITHUB_TOKEN would get no CI runs.
name: prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as X.Y.Z (no leading v)"
        required: true
        type: string
      summary:
        description: "Lead paragraph for the release, in Markdown (default: a standard one if any entry alters or changes measurements)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || {
            echo "prepare-release: run this from main, not $GITHUB_REF" >&2
            exit 1
          }
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PIN_WATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_WATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      # First, because the script is what vets the version input.
      - name: Bump the version and roll the changelog
        env:
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: bash .github/scripts/prepare-release "$VERSION" "$(date -u +%F)"
      - name: Refuse a version that is already tagged or in review
        run: |
          set -euo pipefail
          # Empty when neither exists; a failed lookup fails the step.
          existing=$(git ls-remote origin "refs/tags/v$VERSION" "refs/heads/release/v$VERSION")
          [ -z "$existing" ] || {
            echo "prepare-release: already exists: $existing" >&2
            exit 1
          }
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          title="release: v$VERSION"

          awk -v heading="## [$VERSION]" '
            /^## \[/ { in_section = (index($0, heading " ") == 1); next }
            /^\[[^]]*\]: / { in_section = 0 }
            in_section { print }
          ' CHANGELOG.md >"$RUNNER_TEMP/section.md"
          {
            printf 'Bumps confos to %s and rolls the changelog. ' "$VERSION"
            if grep -m1 '[^[:space:]]' "$RUNNER_TEMP/section.md" | grep -Eq '^(#|[-*+] )'; then
              printf 'No entry says it alters or changes measurements, so the %s section ' "$VERSION"
              printf 'has no lead paragraph. Add one before merging if that is wrong. '
            else
              printf 'Before merging, check that the lead paragraph of the %s section ' "$VERSION"
              printf 'below says what this release does to measurements. '
            fi
            printf 'Merging tags the merge commit %s and publishes the release.\n\n' "\`v$VERSION\`"
            cat "$RUNNER_TEMP/section.md"
          } >"$RUNNER_TEMP/body.md"

          git config user.name "prepare-release"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -m "$title" -- Cargo.toml Cargo.lock CHANGELOG.md
          [ -z "$(git status --short)" ] || {
            echo "prepare-release: unexpected changes left in the worktree" >&2
            git status --short >&2
            exit 1
          }
          git push origin "HEAD:refs/heads/$branch"
          # A branch without a PR would block the next attempt at this version.
          gh pr create --base main --head "$branch" --title "$title" \
            --body-file "$RUNNER_TEMP/body.md" || {
            git push origin --delete "$branch"
            exit 1
          }
