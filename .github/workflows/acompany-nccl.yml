name: Build Acompany NCCL Image

on:
  workflow_dispatch:
    inputs:
      repro:
        description: Build the measured image twice without the final-image cache
        required: false
        type: boolean
        default: false
  push:
    branches: [acompany-nccl-poc]
    paths:
      - .github/workflows/acompany-nccl.yml
      - images/acompany-nccl/**
      - mkosi/**
      - kernel/**
      - src/**
      - crates/**
      - bin/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read
  packages: write

concurrency:
  group: acompany-nccl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(inputs.repro && '["a","b"]' || '["publish"]') }}
    runs-on: big-build-runner
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore completed image
        id: image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/acompany-nccl
          key: >-
            acompany-nccl-image-v1-${{
              inputs.repro && github.run_id || github.sha
            }}-${{ matrix.leg }}

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Setup mkosi
        uses: systemd/mkosi@4736cd836108a97772142c461c49f1ddb4172348 # v27

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mkosi/base/mkosi.local
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" \
            --password-stdin \
            --registry-config mkosi/base/mkosi.local/oras-auth.json

      - name: Install host dependencies
        if: steps.image-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: bin/host-deps systemd-container ovmf cpio kmod

      - name: Restore GPU kernel
        id: gpu-kernel-cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            output/kernel/cache
            output/kernel/manifest.json
            output/kernel/vmlinuz
            kernel/config-x86_64-gpu-relaxed.snapshot
            mkosi/kernel-builder/mkosi.output
          key: >-
            ${{ runner.os }}-acompany-gpu-kernel-v2-${{
              hashFiles(
                'mkosi/kernel-builder/mkosi.conf',
                'mkosi/kernel-builder/mkosi.sandbox/**',
                'kernel/version',
                'kernel/*.config',
                'kernel/*.seed',
                'kernel/*.dts',
                'kernel/patches/**',
                'images/acompany-nccl/module-signing.crt',
                'src/commands/kernel.rs',
                'src/kernel/**'
              )
            }}
          restore-keys: |
            ${{ runner.os }}-acompany-gpu-kernel-v2-

      - name: Restore NVIDIA download cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: output/gpu/cache
          key: ${{ runner.os }}-acompany-nvidia-v1-${{ hashFiles('bin/confos-fetch-gpu') }}

      - name: Restore mkosi package cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mkosi/base/mkosi.pkgcache
          key: >-
            ${{ runner.os }}-acompany-pkgcache-v1-${{
              hashFiles(
                'mkosi/base/mkosi.conf',
                'mkosi/base/mkosi.conf.d/*.conf',
                'mkosi/base/mkosi.profiles/*/mkosi.conf',
                'mkosi/base/mkosi.sandbox/**',
                'images/acompany-nccl/profile/**'
              )
            }}
          restore-keys: |
            ${{ runner.os }}-acompany-pkgcache-v1-

      - name: Build GPU kernel
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          bin/confos kernel \
            --kernel-config-fragment kernel/gpu-relaxed.config \
            --module-signing-cert images/acompany-nccl/module-signing.crt

      - name: Verify OCI kernel support
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          CONFIG=output/kernel/build/linux-$(sed -n 's/^LINUX_VERSION=//p' kernel/version)/.config
          grep -qx 'CONFIG_BPF_SYSCALL=y' "$CONFIG"
          grep -qx 'CONFIG_BPF_JIT=y' "$CONFIG"
          grep -qx 'CONFIG_CGROUP_BPF=y' "$CONFIG"
          grep -qx 'CONFIG_USER_NS=y' "$CONFIG"
          grep -qx 'CONFIG_VETH=y' "$CONFIG"
          grep -qx 'CONFIG_BRIDGE=y' "$CONFIG"
          grep -qx 'CONFIG_BRIDGE_NETFILTER=y' "$CONFIG"
          grep -qx 'CONFIG_NETFILTER_XT_NAT=y' "$CONFIG"
          grep -qx 'CONFIG_IO_URING=y' "$CONFIG"
          grep -qx 'CONFIG_KCMP=y' "$CONFIG"

      - name: Make GPU kernel cache readable
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            output/kernel \
            mkosi/kernel-builder/mkosi.output

      - name: Save GPU kernel
        if: >-
          steps.image-cache.outputs.cache-hit != 'true' &&
          steps.gpu-kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            output/kernel/cache
            output/kernel/manifest.json
            output/kernel/vmlinuz
            kernel/config-x86_64-gpu-relaxed.snapshot
            mkosi/kernel-builder/mkosi.output
          key: ${{ steps.gpu-kernel-cache.outputs.cache-primary-key }}

      - name: Stage NVIDIA driver
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          MODULE_SIG_CERT: images/acompany-nccl/module-signing.crt
          MODULE_SIG_KEY_PEM: ${{ secrets.ACOMPANY_MODULE_SIG_KEY_PEM }}
        run: |
          test -n "$MODULE_SIG_KEY_PEM"
          bin/confos-fetch-gpu

      - name: Build measured image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          bin/confos build acompany-nccl \
            --platform tdx \
            --memory 128G \
            --profile gpu \
            --profile attest-gpu \
            --profile ssh \
            --profile-dir images/acompany-nccl/profile \
            --kernel-config-fragment kernel/gpu-relaxed.config \
            --module-signing-cert images/acompany-nccl/module-signing.crt \
            --script images/acompany-nccl/build-nccl-tests.sh

      - name: Make package cache readable
        if: always() && steps.image-cache.outputs.cache-hit != 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" mkosi/base/mkosi.pkgcache || true

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acompany-nccl-${{ github.run_id }}-${{ matrix.leg }}
          path: |
            output/acompany-nccl/manifest.json
            output/acompany-nccl/roothash
          if-no-files-found: error
          retention-days: 14

      - name: Push candidate artifact
        if: matrix.leg == 'b' || matrix.leg == 'publish'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd output/acompany-nccl
          oras push "ghcr.io/${GITHUB_REPOSITORY,,}:acompany-nccl-${GITHUB_SHA}-candidate" \
            --artifact-type application/vnd.confos.image.v1 \
            disk.raw OVMF.tdx.fd initrd.img manifest.json roothash uki.efi

          # CDI requires a standard OCI image with one tar+gzip layer and the
          # VM disk at disk/disk.raw. Keep the general artifact above for
          # confos pull and publish this deployment-specific representation
          # under a distinct tag.
          cd "$GITHUB_WORKSPACE"
          bin/confos push output/acompany-nccl \
            --cdi \
            --tag "acompany-nccl-${GITHUB_SHA}-candidate-cdi"

  verify-and-promote:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: acompany-nccl-${{ github.run_id }}-*
          path: evidence

      - name: Require identical measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = sorted(Path("evidence").rglob("roothash"))
          manifests = sorted(Path("evidence").rglob("manifest.json"))
          assert len(roots) in (1, 2) and len(manifests) == len(roots)
          if len(roots) == 2:
              assert roots[0].read_bytes() == roots[1].read_bytes(), "roothash differs"
          parsed = []
          for path in manifests:
              value = json.loads(path.read_text())
              value.get("build", {}).pop("timestamp", None)
              parsed.append(value)
          if len(parsed) == 2:
              assert parsed[0] == parsed[1], "manifest differs"
          PY

      - name: Setup ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Promote verified artifact
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SRC="${IMAGE}:acompany-nccl-${GITHUB_SHA}-candidate"
          CDI_SRC="${IMAGE}:acompany-nccl-${GITHUB_SHA}-candidate-cdi"
          oras copy "$SRC" "${IMAGE}:acompany-nccl-${GITHUB_SHA}"
          oras copy "$SRC" "${IMAGE}:acompany-nccl-latest"
          oras copy "$CDI_SRC" "${IMAGE}:acompany-nccl-${GITHUB_SHA}-cdi"
          oras copy "$CDI_SRC" "${IMAGE}:acompany-nccl-cdi-latest"
